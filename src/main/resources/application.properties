spring.application.name=rede-de-prato
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# D-16: the app runs on Oracle by default (application-oracle.properties, credentials from ORACLE_* env vars).
# H2 in memory is only for development and tests: SPRING_PROFILES_ACTIVE=dev (./mvnw test forces it).
spring.profiles.default=oracle

spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.jackson.time-zone=America/Sao_Paulo
app.timezone=America/Sao_Paulo
app.seed.enabled=false
