# Development and tests only (SPRING_PROFILES_ACTIVE=dev; ./mvnw test forces it): H2 in memory, Oracle mode,
# schema created from the entities and filled with simulated data by DataSeeder.
spring.datasource.url=jdbc:h2:mem:redeprato;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.seed.enabled=true
