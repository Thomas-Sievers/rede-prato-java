# Activated with SPRING_PROFILES_ACTIVE=oracle. Credentials come only from environment variables.
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
app.seed.enabled=false

# FIAP Oracle limits sessions per user (ORA-02391). Keep the pool small so the local app,
# SQL Developer and Render can share the same RM. Dialect set explicitly (same as the CP3 project).
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
